<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style>
<script src="lib.js"></script><script src="ch.js"></script><script src="sets.js"></script><script src="data.js"></script><script src="story_pilot.js"></script></head>
<body><div id="r"></div><script>
const W0=576,H0=1024, SC = window.innerWidth/576;
const SETX=window.SETS.SETS; const {SHOTS,cabine}=PILOT;
const {clamp,lerp,E,f,noise1}=L;
function camAt(shot,lt,t){ const k=shot.cam; let c=k[0]; let out;
  if(lt<=k[0][0]) out=k[0]; else { out=k[k.length-1]; for(let i=1;i<k.length;i++){ if(lt<=k[i][0]){ const a=k[i-1],b=k[i],u=E[b[4]||'io']((lt-a[0])/Math.max(1e-6,b[0]-a[0])); out=[lt,lerp(a[1],b[1],u),lerp(a[2],b[2],u),lerp(a[3],b[3],u)]; break; } } }
  // microbalanço de câmera (handheld muito sutil) para nunca ficar rígida
  return {cx:out[1]+noise1(t*0.9,1)*1.2, cy:out[2]+noise1(t*0.8,2)*1.2, z:out[3]*(1+noise1(t*0.5,3)*0.003)};
}
function layerT(c,fac){ const sl=1+(c.z-1)*fac; return `translate(288,512) scale(${f(sl)}) translate(${f(-c.cx*fac)},${f(-c.cy*fac)})`; }
function captions(t){
  const Wd=WORDS, size=44; const cv=captions._cv||(captions._cv=document.createElement('canvas').getContext('2d')); cv.font='800 44px Inter';
  const clean=s=>s.replace(/[.,:;]$/,''); const wid=w=>cv.measureText(clean(w.w)).width+4, SP=size*0.34, MAXW=500;
  if(!captions._chunks){ // 2–4 palavras, quebra em pontuação e NUNCA passa da largura útil (regra: legenda não sai da tela)
    const chunks=[]; let cur=[],cw=0;
    Wd.forEach((w,i)=>{ const ww=wid(w); if(cur.length&&(cw+SP+ww>MAXW||cur.length>=4||Wd[i-1].frase!==w.frase||/[,.:?!]$/.test(Wd[i-1].w))){chunks.push(cur);cur=[];cw=0;} cur.push(i); cw+=(cur.length>1?SP:0)+ww; });
    if(cur.length)chunks.push(cur); captions._chunks=chunks; }
  const chunks=captions._chunks; let ch=null;
  for(let i=0;i<chunks.length;i++){ const a=Wd[chunks[i][0]], b=Wd[chunks[i][chunks[i].length-1]]; const nxt=chunks[i+1]?Wd[chunks[i+1][0]].ini:1e9; if(t>=a.ini-0.04&&t<Math.min(b.fim+0.22,nxt-0.01)){ch=chunks[i];break;} }
  if(!ch) return '';
  const words=ch.map(i=>Wd[i]); const txt=words.map(w=>clean(w.w)); const widths=txt.map(s=>cv.measureText(s).width+4), total=widths.reduce((a,b)=>a+b,0)+SP*(txt.length-1);
  let x=288-total/2; let out='';
  txt.forEach((s,k)=>{ const act=t>=words[k].ini-0.02 && (k===txt.length-1 || t<words[k+1].ini-0.02) ; const wc=act?'#ffc93c':'#ffffff';
    out+=`<text x="${f(x+widths[k]/2)}" y="775" text-anchor="middle" font-family="Inter" font-weight="800" font-size="${size}" fill="${wc}" stroke="#1a2038" stroke-width="9" stroke-linejoin="round" paint-order="stroke">${s}</text>`; x+=widths[k]+SP; });
  return out;
}
function sceneSVG(t,shot,off){
  const lt=t-shot.t0; const cam=camAt(shot,lt,t); let s='';
  if(shot.special){ s=`<g transform="${layerT(cam,1)}">${cabine(t,lt,shot.special)}</g>`; return `<g transform="translate(${f(off)},0)">${s}</g>`; }
  const S=SETX[shot.set]; const L1=layerT(cam,1);
  s+=`<g transform="${layerT(cam,0.42)}">${S.far(t)}</g><g transform="${layerT(cam,0.78)}">${S.mid(t)}</g>`;
  s+=`<g transform="${L1}">${S.near(t)}${S.props?S.props(t):''}${S.light?S.light(t):''}`;
  if(shot.set==='padaria'&&shot.front){ s+=(shot.actors?shot.actors(t,lt).join(''):'')+S.front(t); }
  else { s+=(shot.actors?shot.actors(t,lt).join(''):''); }
  s+=(shot.world?shot.world(t,lt):'')+`</g>`;
  if(S.fore) s+=`<g transform="${layerT(cam,1.35)}">${S.fore(t)}</g>`;
  if(S.tint) s+=`<rect x="-50" y="-50" width="700" height="1130" fill="${S.tint[0]}" opacity="${S.tint[1]}"/>`;
  return `<g transform="translate(${f(off)},0)">${s}</g>`;
}
function shotAt(t){ for(const sh of SHOTS) if(t>=sh.t0&&t<sh.t1) return sh; return SHOTS[SHOTS.length-1]; }
function render(t){
  const shot=shotAt(t); const F=1/30;
  // whip: últimos 2 quadros do plano anterior escorregam p/ a esquerda; 2 primeiros do novo entram da direita
  let off=0; const idx=SHOTS.indexOf(shot); const nxt=SHOTS[idx+1];
  if(shot.whipIn){ const u=(t-shot.t0)/(2*F); if(u<1) off=(1-E.out(clamp(u)))*340; }
  if(nxt&&nxt.whipIn){ const u=(nxt.t0-t)/(2*F); if(u>0&&u<=1) off=-(1-u)*340; }
  let body=sceneSVG(t,shot,off);
  if(off!==0) body+=sceneSVG(t,shot,off+(off<0?576:-576));   // preenche a borda descoberta no whip (sem faixa preta)
  const vig=`<defs><radialGradient id="vg" cx="50%" cy="46%" r="75%"><stop offset="0.55" stop-color="#1b1830" stop-opacity="0"/><stop offset="1" stop-color="#1b1830" stop-opacity=".34"/></radialGradient></defs><rect width="576" height="1024" fill="url(#vg)"/>`;
  document.getElementById('r').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="${W0*SC}" height="${H0*SC}" viewBox="0 0 576 1024"><clipPath id="sc"><rect width="576" height="1024"/></clipPath><g clip-path="url(#sc)">${body}${vig}${captions(t)}</g></svg>`;
}
</script></body></html>
