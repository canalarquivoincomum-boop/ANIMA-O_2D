<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}svg{display:block}</style>
<script src="lib.js"></script><script src="ch.js"></script><script src="sets.js"></script><script src="world.js"></script><script src="rider.js"></script></head><body><div id="r"></div>
<script>
function render(t){
  const {drawChar,EXPR,POSE}=CH, W=WORLD; let s='<rect width="1700" height="620" fill="#2a2f5c"/><rect y="520" width="1700" height="100" fill="#2e3250"/>';
  const cfg=[{lean:0.1,helmet:0,x:240,ex:'calm'},{lean:0.55,helmet:1,x:700,ex:'focus'},{lean:1,helmet:2,x:1160,ex:'focus'}];
  cfg.forEach(k=>{ const R=RIDER.riderBody({lean:k.lean,bob:Math.sin(t*3)*1.5,light:{ox:1,oy:-.8,rim:'#ffe9a8'}}); const s_=W.charScale(1.75);
    s+=`<g transform="translate(${k.x},520) scale(1.1) ">`;
    s+=`<g transform="translate(0,0)">${R.back}</g>${W.moto(0,t,0,{beam:.4})}<g>${R.front}</g>`;
    s+=drawChar({cast:'nando',bodyless:true,x:R.head[0],y:R.head[1]+208*s_,s:s_,flip:1,t,pose:POSE.stand,expr:EXPR[k.ex],turn:0.72,helmet:k.helmet,look:[600,-120],idle:0,light:{ox:1,oy:-.8,rim:'#ffe9a8'}}).svg;
    s+='</g>'; });
  document.getElementById('r').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="620" viewBox="0 0 1700 620">${s}</svg>`;
}
</script></body></html>
