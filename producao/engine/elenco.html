 names.forEach(([c,n],i)=>{ const x=200+(i%4)*400, y=330+Math.floor(i/4)*390; s+=`<text x="${x}" y="${y+40}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="30" fill="#ffc93c">${n}</text>`+drawChar({cast:c,x,y:y,s:1.1,flip:1,t:1,idle:0,pose:POSE.stand,expr:EXPR.smile,look:[x,y-180],turn:0,helmet:c==='nando'?1:0,light:{ox:1,oy:-0.8,rim:'#ffe9a8'}}).svg; });
 document.getElementById('r').innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="'+innerWidth+'" height="'+innerHeight+'" viewBox="0 0 1600 1200">'+s+'</svg>'; }
